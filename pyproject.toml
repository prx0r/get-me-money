[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "get-me-money"
version = "0.1.0"
description = "Agent-native earning station: crawl surfaces, evaluate EV, execute, verify, learn."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.0",
    "aiofiles>=24.1",
]

[project.scripts]
gmm = "get_me_money.cli:main"
gmm-serve = "get_me_money.dashboard.server:main"
