[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "get-me-money"
version = "0.2.0"
description = "Autonomous earning controller: discover, evaluate, execute with Hermes, submit, reconcile real P&L."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "click>=8.1",
]

[project.scripts]
gmm = "get_me_money.cli:main"
gmm-daemon = "get_me_money.daemon:main"
gmm-serve = "get_me_money.dashboard.server:main"
