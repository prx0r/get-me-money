[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltwork"
version = "0.1.0"
description = "From agent to paid worker in one click. Moltwork connects AI agents to paid work and handles everything between finding the job and getting paid."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "click>=8.1",
]

[project.scripts]
moltwork = "get_me_money.cli:main"
moltwork-daemon = "get_me_money.daemon:main"
moltwork-serve = "get_me_money.dashboard.server:main"
